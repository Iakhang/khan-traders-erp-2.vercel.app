<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- موبائل ریسپانسیو کے لیے یہ ٹیگ سب سے زیادہ ضروری ہے -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khan Traders - ERP Portal</title>
    
    <!-- PWA Theme Color -->
    <meta name="theme-color" content="#2457a7">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/icon.png">

    <style>
        /* بنیادی سیٹنگ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
        }

        /* مین ڈیش بورڈ لے آؤٹ (فليکس باکس) */
        .dashboard-container {
            display: flex;
            min-height: 100vh;
            flex-direction: row; /* ڈیسک ٹاپ کے لیے سائیڈ بائی سائیڈ */
        }

        /* سائیڈ بار کی سٹائلنگ */
        .sidebar {
            width: 260px;
            background-color: #1e3a8a;
            color: #fff;
            padding: 20px;
            flex-shrink: 0;
        }

        /* مین مواد کا علاقہ */
        .main-content {
            flex-grow: 1;
            padding: 20px;
            overflow-x: auto;
        }

        /* موبائل یا چھوٹی سکرین کے لیے ریسپانسیو رولز (768px سے کم سکرین پر) */
        @media (max-width: 768px) {
            .dashboard-container {
                flex-direction: column; /* موبائل پر سائیڈ بار اوپر اور مواد نیچے آجائے گا */
            }

            .sidebar {
                width: 100% !important; /* موبائل پر سائیڈ بار پوری سکرین کی چड़ाई لے گی */
                height: auto;
            }

            .main-content {
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- سائیڈ بار مینو -->
        <div class="sidebar">
            <h2>Khan Traders</h2>
            <p>Admin Dashboard</p>
            <!-- آپ کا باقی مینو یہاں آئے گا -->
        </div>

        <!-- مین ڈیش بورڈ کا حصہ -->
        <div class="main-content">
            <h1>Dashboard Overview</h1>
            <p>خوش آمدید! آپ کا ERP پورٹل اب موبائل پر بالکل فٹ نظر آئے گا۔</p>
        </div>
    </div>

</body>
</html>
